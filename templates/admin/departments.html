{% extends 'admin/base.html' %}

{% block content %}
<div style="display: grid; grid-template-columns: 1fr 350px; gap: 30px;">
    <div class="admin-card">
        <h3><i class="fa-solid fa-building-user"></i> Department Management</h3>
        <div class="table-responsive">
            <table class="table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Patients Waiting</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for dept in departments %}
                    <tr>
                        <td>#{{ dept.id }}</td>
                        <td><strong>{{ dept.name }}</strong><br><small style="color:#64748b;">{{ dept.description }}</small></td>
                        <td><span class="badge badge-warning">{{ dept.waiting }} patients</span></td>
                        <td>
                            <form action="{{ url_for('admin.delete_department', dept_id=dept.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Delete department?');">
                                <button type="submit" class="btn btn-xs" style="color: #ef4444;"><i class="fa-solid fa-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <div class="admin-card">
        <h3><i class="fa-solid fa-plus-circle"></i> Add Department</h3>
        <form action="{{ url_for('admin.add_department') }}" method="POST">
            <div class="form-group">
                <label>Department Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Cardiology" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">Create Department</button>
        </form>
    </div>
</div>
{% endblock %}
